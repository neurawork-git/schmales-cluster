# dienste/values.yaml nach Schritt 3: Die Pipeline hat die IP 203.0.113.10 gemeldet,
# zum Testen steht jetzt <IP>.nip.io als Basis, ohne Zertifikat.
# Erzeugt mit:
#   helm template dienste ./dienste --namespace dienste -f beispiel/eingabe.yaml

eingang:
  basis: "203.0.113.10.nip.io"
  tls: false

mcp:
  image: traefik/whoami:v1.10
  port: 80
  aufNull: true

openwebui:
  image: ghcr.io/open-webui/open-webui:v0.13.3
  speicher: 5Gi

postgres:
  speicher: 8Gi

argocd:
  repo: https://github.com/beispiel-org/schmales-cluster
