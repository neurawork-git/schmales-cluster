---
# Source: dienste/templates/openwebui.yaml
# Platte für /app/backend/data (Uploads, Vektorindex). Sie hängt immer nur an einem
# Rechner (ReadWriteOnce), darum läuft Open WebUI in genau einer Kopie.
# keep: Helm löscht die Platte nie, auch nicht nach einem Fehlversuch.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: dienste-openwebui-daten
  labels:
    app.kubernetes.io/name: openwebui
    app.kubernetes.io/instance: dienste
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: dienste-0.1.0
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi

---
# Source: dienste/templates/mcp.yaml
apiVersion: v1
kind: Service
metadata:
  name: dienste-mcp
  labels:
    app.kubernetes.io/name: mcp
    app.kubernetes.io/instance: dienste
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: dienste-0.1.0
spec:
  selector:
    app.kubernetes.io/name: mcp
    app.kubernetes.io/instance: dienste
  ports:
    - name: http
      port: 80
      targetPort: http

