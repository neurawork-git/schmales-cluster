                port:
                  number: 80

---
# Source: dienste/templates/argocd.yaml
# Argo CD vergleicht dieses Chart im Repo mit dem, was im Cluster läuft, und zeigt
# jede Abweichung. Es beobachtet nur: keine syncPolicy, ausgerollt wird von der Pipeline.
# Der Name ist der Name des Helm-Release — so erkennt Argo CD die Objekte wieder.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dienste
  namespace: grundausstattung
  labels:
    app.kubernetes.io/name: argocd
    app.kubernetes.io/instance: dienste
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: dienste-0.1.0
spec:
  project: default
  source:
    repoURL: https://github.com/beispiel-org/schmales-cluster
    targetRevision: main
    path: dienste
    helm:
      releaseName: dienste
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: dienste

---
# Source: dienste/templates/mcp.yaml
# Auf null: ohne Anfragen null Kopien, die nächste Anfrage an mcp.<basis> weckt den Dienst.
apiVersion: http.keda.sh/v1alpha1
kind: HTTPScaledObject
metadata:
  name: dienste-mcp
  labels:
    app.kubernetes.io/name: mcp
    app.kubernetes.io/instance: dienste
    app.kubernetes.io/managed-by: Helm
    helm.sh/chart: dienste-0.1.0
spec:
  hosts:
    - mcp.203.0.113.10.nip.io
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: dienste-mcp
    service: dienste-mcp
    port: 80
  replicas:
    min: 0
    max: 1
  scaledownPeriod: 60      # Sekunden ohne Anfrage, bis auf null gestellt wird
